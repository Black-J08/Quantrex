[project]
name = "quantrex-test-support"
version = "0.1.0"
description = "Quantrex test support utilities - temporary CSV file generation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv.sources]
quantrex-test-support = { path = "." }

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"