[project]
name = "quantrex"
version = "0.2.0"
description = "Quantrex algorithmic trading framework (meta-package)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "python-dotenv>=1.2.4",
    "aiofiles>=25.1.0",
    "pyarrow>=26.0.0",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pandas-ta-classic>=0.8.32",
    "py-spy>=0.4.2",
    "mypy>=2.4.0",
    "ruff>=0.16.10",
    "types-aiofiles>=25.1.0.20260518",
]
