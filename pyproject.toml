[tool.uv]
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
quantrex-core = { workspace = true }
quantrex-data = { workspace = true }
quantrex-backtest = { workspace = true }
quantrex-live = { workspace = true }
quantrex-test-support = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pandas>=3.0.5",
    "pandas-ta-classic>=0.8.32",
    "py-spy>=0.3.14"
]
