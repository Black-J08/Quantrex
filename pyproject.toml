[project]
name = "quantrex"
version = "0.2.0"
description = "Quantrex algorithmic trading framework (meta-package)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pandas>=3.0.5",
    "pandas-ta-classic>=0.8.32",
    "py-spy>=0.3.14",
    "mypy>=2.3.1",
]
