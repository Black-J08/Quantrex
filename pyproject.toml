[project]
name = "quantrex"
version = "0.1.0"
description = "Quantrex - Event-driven algorithmic trading framework"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.uv.workspace]
members = ["packages/*"]

[tool.setuptools.packages.find]
where = ["."]
include = []

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
